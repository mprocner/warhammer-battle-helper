<!DOCTYPE html>
<!--
  Source of warhammer-battle-helper-front/public/og-image.png (the link preview image).
  Regenerate with scripts/og-image/render.sh - see the comment there.
  Fonts and the logo are read from the frontend, so `npm install` must have run there.
-->
<html lang="pl">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Cinzel';
    font-weight: 700;
    src: url('../../warhammer-battle-helper-front/node_modules/@fontsource/cinzel/files/cinzel-latin-ext-700-normal.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+1E00-1E9F;
  }
  @font-face {
    font-family: 'Cinzel';
    font-weight: 700;
    src: url('../../warhammer-battle-helper-front/node_modules/@fontsource/cinzel/files/cinzel-latin-700-normal.woff2') format('woff2');
    unicode-range: U+0000-00FF;
  }
  @font-face {
    font-family: 'Crimson Text';
    font-style: italic;
    font-weight: 400;
    src: url('../../warhammer-battle-helper-front/node_modules/@fontsource/crimson-text/files/crimson-text-latin-ext-400-italic.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+1E00-1E9F;
  }
  @font-face {
    font-family: 'Crimson Text';
    font-style: italic;
    font-weight: 400;
    src: url('../../warhammer-battle-helper-front/node_modules/@fontsource/crimson-text/files/crimson-text-latin-400-italic.woff2') format('woff2');
    unicode-range: U+0000-00FF;
  }

  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  /* Dark-brown frame from the theme around a parchment field: the logo itself is dark brown,
     so it needs the light parchment behind it to stay readable. */
  body {
    background: #3a2f1f;
    box-sizing: border-box;
    padding: 28px;
  }

  .card {
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #f4e8d8 0%, #e8dcc4 100%);
    border: 4px solid #c9975b;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 56px;
  }

  .logo {
    width: 420px;
    height: 420px;
    /* The PNG has a white backdrop; multiply drops it onto the parchment. */
    mix-blend-mode: multiply;
  }

  .text {
    display: flex;
    flex-direction: column;
    gap: 18px;
    max-width: 520px;
  }

  .wordmark {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 104px;
    line-height: 1;
    color: #3a2f1f;
    letter-spacing: 0.02em;
  }

  .rule {
    width: 120px;
    height: 4px;
    background: #c9975b;
  }

  .tagline {
    font-family: 'Crimson Text', serif;
    font-style: italic;
    font-size: 46px;
    line-height: 1.15;
    color: #7a5c42;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="../../warhammer-battle-helper-front/public/img/logo.png" alt="" />
    <div class="text">
      <div class="wordmark">PlayRPG</div>
      <div class="rule"></div>
      <div class="tagline">Wirtualny stół do gier&nbsp;RPG</div>
    </div>
  </div>
</body>
</html>
