services:
  frontend:
    build:
      context: ./warhammer-battle-helper-front
      dockerfile: Dockerfile.prod
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8080}
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./warhammer-battle-helper-backend
      dockerfile: Dockerfile.prod
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - PORT=8080
      - GIN_MODE=release
      - MONGO_URI=mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-example}@mongo:27017
      - MONGO_DB_NAME=${MONGO_DB_NAME:-battle_helper}
      - AVATARS_PATH=/app/avatars
      - USER_FILES_PATH=/app/user-files
      - MUSIC_FILES_PATH=/app/music-files
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - APP_URL=${APP_URL:-}
    volumes:
      - ./warhammer-battle-helper-backend/keys:/app/keys:ro
      - backend-avatars:/app/avatars
      - backend-user-files:/app/user-files
      - backend-music-files:/app/music-files
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-example}
    volumes:
      - mongo-data:/data/db
    # Not exposing port externally in production

  mongo-express:
    image: mongo-express:1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-example}@mongo:27017
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_BASICAUTH=false
      - ME_CONFIG_SITE_BASEURL=/mongo-admin/
      - ME_CONFIG_SITE_SESSIONSECRET=${MONGO_EXPRESS_SECRET:-changeme}
    depends_on:
      - mongo

volumes:
  mongo-data:
  backend-avatars:
  backend-user-files:
  backend-music-files:
