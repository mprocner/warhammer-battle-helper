services:
  frontend:
    build:
      context: ./warhammer-battle-helper-front
      dockerfile: Dockerfile.prod
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8080}
        REACT_APP_GA_MEASUREMENT_ID: ${REACT_APP_GA_MEASUREMENT_ID:-}
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./warhammer-battle-helper-backend
      dockerfile: Dockerfile.prod
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - PORT=8080
      - GIN_MODE=release
      - MONGO_URI=mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-example}@mongo:27017
      - MONGO_DB_NAME=${MONGO_DB_NAME:-battle_helper}
      - AVATARS_PATH=/app/avatars
      - USER_FILES_PATH=/app/user-files
      - MUSIC_FILES_PATH=/app/music-files
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - APP_URL=${APP_URL:-}
    volumes:
      - ./warhammer-battle-helper-backend/keys:/app/keys:ro
      - backend-avatars:/app/avatars
      - backend-user-files:/app/user-files
      - backend-music-files:/app/music-files
    depends_on:
      - mongo

  admin:
    build:
      context: ./warhammer-battle-helper-admin
      dockerfile: Dockerfile.prod
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8080}
        REACT_APP_BASENAME: ${ADMIN_BASENAME:-/admin}
    ports:
      - "127.0.0.1:3001:80"
    restart: unless-stopped
    depends_on:
      - backend

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-example}
    volumes:
      - mongo-data:/data/db
    # Not exposing port externally in production

  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:9999:8080"
    environment:
      - DOZZLE_BASE=/logs
    restart: unless-stopped

  mongo-express:
    image: mongo-express:1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-example}@mongo:27017
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_BASICAUTH=false
      - ME_CONFIG_SITE_BASEURL=/mongo-admin/
      - ME_CONFIG_SITE_SESSIONSECRET=${MONGO_EXPRESS_SECRET:-changeme}
    depends_on:
      - mongo

  # Netdata — CPU/RAM per container, 1s resolution, local storage
  # network_mode: host makes port 19999 listen on ALL interfaces (public IP included),
  # unlike dozzle/mongo-express above. Block it: sudo ufw deny 19999
  # Access via SSH tunnel: ssh -L 19999:127.0.0.1:19999 ubuntu@playrpg.net
  # See the Monitoring section in README.md
  netdata:
    image: netdata/netdata
    hostname: playrpg-vps
    pid: host
    network_mode: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdata-config:/etc/netdata
      - netdata-lib:/var/lib/netdata
      - netdata-cache:/var/cache/netdata
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/os-release:/host/etc/os-release:ro
    restart: unless-stopped

volumes:
  mongo-data:
  backend-avatars:
  backend-user-files:
  backend-music-files:
  netdata-config:
  netdata-lib:
  netdata-cache:
