name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # umożliwia ręczne odpalenie z UI GitHuba

concurrency:                # nie pozwól na dwa równoległe deploye
  group: deploy-production
  cancel-in-progress: false # nie przerywaj trwającego deployu w połowie builda

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warhammer-battle-helper-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'      # zgodne z go.mod
          cache-dependency-path: warhammer-battle-helper-backend/go.sum
      - run: go test ./...

  deploy:
    needs: test                     # deploy tylko po zielonych testach
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}        # opcjonalnie, domyślnie 22
          command_timeout: 30m                    # build --no-cache trwa długo
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PROJECT_DIR }}
            bash scripts/deploy.sh
